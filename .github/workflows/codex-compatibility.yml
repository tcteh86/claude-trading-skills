name: Codex compatibility

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.agents/skills/**'
      - '.github/workflows/codex-compatibility.yml'
      - 'investment_intelligence/**'
      - 'tests/custom/**'
      - 'skills-index.yaml'
      - 'skills/**'
      - 'scripts/**'
      - 'workflows/**'
      - 'examples/workflows/**'
      - 'examples/custom/multibagger/**'
      - 'pyproject.toml'
      - 'uv.lock'

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.12.10"
      - run: uv sync --locked --no-install-project --extra dev --extra ci
      - run: uv run --no-sync python -m pytest -q tests/custom
